CommandLineProcessor.ERROR_0013_RESTORE_CONNECTION_LOST=Il ripristino non \u00e8 stato completato: la connessione al server Pentaho \u00e8 stata persa mentre il ripristino era ancora in esecuzione. Di solito ci\u00f2 significa che la sessione HTTP o un timeout del proxy/bilanciatore di carico \u00e8 trascorso prima del termine del ripristino. Controllare i log del server, aumentare il valore <session-timeout> in tomcat/webapps/pentaho/WEB-INF/web.xml (in minuti) e gli eventuali timeout di lettura dei proxy, riavviare il server ed eseguire nuovamente il ripristino. Errore sottostante: {0}
