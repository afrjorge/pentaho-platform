CommandLineProcessor.ERROR_0012_SERVER_ERROR=La operaci\u00f3n {0} no se complet\u00f3 correctamente. El servidor inform\u00f3 del siguiente error:
CommandLineProcessor.ERROR_0013_RESTORE_CONNECTION_LOST=La restauraci\u00f3n no se complet\u00f3: se perdi\u00f3 la conexi\u00f3n con el servidor Pentaho mientras la restauraci\u00f3n segu\u00eda en curso. Esto suele significar que la sesi\u00f3n HTTP o un tiempo de espera de proxy/balanceador de carga transcurri\u00f3 antes de que finalizara la restauraci\u00f3n. Revise los registros del servidor, aumente el valor <session-timeout> en tomcat/webapps/pentaho/WEB-INF/web.xml (en minutos) y los tiempos de espera de lectura de los proxies, reinicie el servidor y vuelva a ejecutar la restauraci\u00f3n. Error subyacente: {0}
CommandLineProcessor.ERROR_0014_SERVER_ERROR_NO_DETAIL=La operaci\u00f3n {0} no se complet\u00f3 correctamente. El servidor no indic\u00f3 ning\u00fan motivo; consulte los registros del servidor Pentaho (tomcat/logs/catalina.out y el archivo pentaho.log) para conocer el error subyacente.
SolutionImportHandler.ERROR_0002_SCHEDULER_RESTART_FAILED=No se pudo reiniciar el planificador despu\u00e9s de importar las programaciones. Es posible que el planificador del servidor Pentaho siga en pausa; revise los registros del servidor y reinicie el planificador manualmente si es necesario.
