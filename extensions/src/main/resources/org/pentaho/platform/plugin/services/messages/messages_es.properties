CommandLineProcessor.DATASOURCE_IMPORT_PARTIAL_ERROR=Estado de importaci\u00f3n: Error - Se detect\u00f3 carga parcial. La transferencia parece estar incompleta. Por favor, reintente la importaci\u00f3n.
