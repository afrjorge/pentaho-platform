CommandLineProcessor.DATASOURCE_IMPORT_CONNECTION_ERROR=Estado de importaci\u00f3n: Error de conexi\u00f3n - No se puede conectar a la fuente de datos. Por favor, verifique la configuraci\u00f3n de conexi\u00f3n.
