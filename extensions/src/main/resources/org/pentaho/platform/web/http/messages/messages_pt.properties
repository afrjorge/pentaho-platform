FileService.ERROR_RESTORE_SESSION_EXPIRED=A restaura\u00e7\u00e3o n\u00e3o foi conclu\u00edda: a sess\u00e3o HTTP expirou enquanto a restaura\u00e7\u00e3o ainda estava em execu\u00e7\u00e3o, de modo que o servidor rejeitou as opera\u00e7\u00f5es restantes de reposit\u00f3rio, seguran\u00e7a e agendador. Todos os erros registrados acima desta linha s\u00e3o consequ\u00eancia da sess\u00e3o expirada e n\u00e3o do conte\u00fado do backup. Aumente o tempo limite de sess\u00e3o no Pentaho Server (o elemento <session-timeout> de tomcat/webapps/pentaho/WEB-INF/web.xml, expresso em minutos) para que seja maior que o tempo necess\u00e1rio para a restaura\u00e7\u00e3o, reinicie o servidor e execute a restaura\u00e7\u00e3o novamente.
FileService.ERROR_UNABLE_TO_RECORD_SESSION_EXPIRATION=N\u00e3o foi poss\u00edvel registrar a expira\u00e7\u00e3o da sess\u00e3o no log de restaura\u00e7\u00e3o
