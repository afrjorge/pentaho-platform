FileService.ERROR_RESTORE_SESSION_EXPIRED=Het herstel is niet voltooid: de HTTP-sessie is verlopen terwijl het herstel nog werd uitgevoerd, waardoor de server de resterende repository-, beveiligings- en plannerbewerkingen heeft geweigerd. Alle fouten die boven deze regel zijn geregistreerd, zijn een gevolg van de verlopen sessie en niet van de inhoud van de back-up. Verhoog de sessietime-out op de Pentaho Server (het element <session-timeout> in tomcat/webapps/pentaho/WEB-INF/web.xml, uitgedrukt in minuten) zodat deze langer is dan de tijd die het herstel nodig heeft, start de server opnieuw op en voer het herstel opnieuw uit.
